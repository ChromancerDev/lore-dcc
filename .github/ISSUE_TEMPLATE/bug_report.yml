name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        `Lore > File a Bug` in Houdini or Blender fills in the DCC, versions, OS and the last Lore error for you, with server addresses, emails and IDs masked. Check it before you submit.
        This repository is public: leave out server addresses, user names and anything private.
  - type: input
    id: dcc
    attributes:
      label: DCC
      description: Houdini or Blender.
      placeholder: Houdini
    validations:
      required: true
  - type: input
    id: dcc-version
    attributes:
      label: DCC version
      placeholder: "22.0.429"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: What version of the Lore plugin are you running?
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: lore-version
    attributes:
      label: Lore version
      description: The output of `lore --version` in a terminal.
      placeholder: "0.9.0+783"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows-11-10.0.26100-SP0
  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing, and what happened?
      description: The steps you took, what you expected, and what you got instead.
      placeholder: |
        I opened a scene inside a Lore working copy and chose Lore > Lock.
        I expected the file to be locked, but ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where in the plugin did it happen?
      multiple: true
      options:
        - Install or startup
        - Info
        - Lock or Discard changes
        - Prompts when saving or opening a file
        - Commit or push
        - Sync Dependencies
        - Collect Outputs or render outputs
        - Something else
  - type: textarea
    id: output
    attributes:
      label: Relevant log output
      description: Please copy and paste the text of any Lore dialog and any relevant output from Houdini's console or Blender's system console. This will be automatically formatted into code, so no need for backticks.
      render: text
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
