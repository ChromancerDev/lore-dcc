name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  houdini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/lore_dcc/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the Houdini zip
        run: |
          zip -r "lore-dcc-houdini-$VERSION.zip" python houdini docs LICENSE README.md -x '*__pycache__*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: houdini
          path: lore-dcc-houdini-*.zip

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package and manifest versions
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/lore_dcc/__init__.py)
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' blender/blender_manifest.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          test "$manifest" = "$version" || { echo "manifest $manifest != $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the Blender extension zip
        # The manifest sits at the zip root and the core under python/, where blender/__init__.py looks first.
        run: |
          mkdir -p build/python
          cp blender/blender_manifest.toml blender/__init__.py LICENSE README.md build/
          cp -r docs build/
          cp -r python/lore_dcc build/python/
          (cd build && zip -r "../lore-dcc-blender-$VERSION.zip" . -x '*__pycache__*' '*.pyc')
      - uses: actions/upload-artifact@v4
        with:
          name: blender
          path: lore-dcc-blender-*.zip

  publish:
    needs: [houdini, blender]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
