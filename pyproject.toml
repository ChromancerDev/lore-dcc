[project]
name = "lore-dcc"
version = "0.1.0"
description = "Lore version control inside DCCs. Houdini first."
license = "MIT"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-third-party = ["bpy", "hou"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
